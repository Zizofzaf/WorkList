
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fd">
  <title>JobTrack — Your career checklist</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <span class="brand-icon">✓</span>
      <span>jobtrack<span class="dot">.</span></span>
    </div>

    <div class="header-note">
      <span class="live-dot"></span>
      Your career checklist
    </div>
  </header>

  <!-- MAIN -->
  <main>

    <div class="eyebrow">STAY ON TRACK</div>

    <section class="hero">
      <div>
        <h1>One step <span>closer.</span></h1>
        <p class="subtitle">
          Every application, all in one calm place.
        </p>
      </div>

      <button class="primary" id="addBtn" type="button">
        + New application
      </button>
    </section>

    <!-- NAVIGATION -->
    <section class="workspace">

      <nav class="tabs" aria-label="Application views">
        <button
          class="tab active"
          id="activeTab"
          type="button"
          aria-pressed="true"
        >
          Active
          <span class="tab-count" id="activeCount">0</span>
        </button>

        <button
          class="tab"
          id="historyTab"
          type="button"
          aria-pressed="false"
        >
          History
          <span class="tab-count" id="historyCount">0</span>
        </button>
      </nav>

      <!-- TOOLBAR -->
      <div class="toolbar">

        <div>
          <h2 class="queue-title" id="listTitle">
            Your applications
          </h2>
          <p class="section-description" id="listDescription">
            Applications you're currently tracking.
          </p>
        </div>

        <input
          class="search"
          type="search"
          id="search"
          placeholder="Search company or position..."
          aria-label="Search applications"
        >

      </div>

      <!-- APPLICATION LIST -->
      <div id="list" class="list" aria-live="polite"></div>

    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>Small steps. Big opportunities.</span>

    <div class="footer-actions">
      <button class="link" id="backupBtn" type="button">
        Backup
      </button>

      <button class="link" id="restoreBtn" type="button">
        Restore
      </button>

      <input
        type="file"
        id="restoreFile"
        accept=".json,application/json"
        hidden
      >
    </div>
  </footer>

</div>

<!-- ADD / EDIT POPUP -->
<div class="overlay hidden" id="editorOverlay">

  <section
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >

    <div class="modal-heading">
      <h2 id="modalTitle">New application</h2>

      <button
        class="close"
        type="button"
        data-close
        aria-label="Close"
      >×</button>
    </div>

    <form id="jobForm">

      <div class="fields">

        <div>
          <label for="company">Company *</label>
          <input
            class="field"
            id="company"
            required
            maxlength="120"
            placeholder="e.g. Colgate"
          >
        </div>

        <div>
          <label for="position">Position *</label>
          <input
            class="field"
            id="position"
            required
            maxlength="180"
            placeholder="e.g. Management Trainee"
          >
        </div>

        <div class="two">

          <div>
            <label for="applied">Applied date</label>
            <input
              class="field"
              id="applied"
              type="date"
            >
          </div>

          <div>
            <label for="platform">Platform</label>
            <select class="field" id="platform">
              <option>JobStreet</option>
              <option>Career Website</option>
              <option>LinkedIn</option>
              <option>Email</option>
              <option>Other</option>
            </select>
          </div>

        </div>

        <div>
          <label for="status">Application status</label>

          <select class="field" id="status">
            <optgroup label="Active">
              <option value="Pending">Pending</option>
              <option value="Assessment">Assessment</option>
              <option value="Interview">Interview</option>
              <option value="Offer">Offer</option>
            </optgroup>

            <optgroup label="History">
              <option value="Rejected">Rejected</option>
              <option value="Job Closed">Job Closed</option>
            </optgroup>
          </select>

          <p class="field-help" id="statusHelp">
            Rejected and Job Closed applications are moved to History.
          </p>
        </div>

        <div>
          <label for="notes">Notes (optional)</label>
          <textarea
            class="field"
            id="notes"
            maxlength="5000"
            placeholder="Assessment, email, updates from HR..."
          ></textarea>
        </div>

      </div>

      <div class="actions">
        <button
          class="secondary"
          type="button"
          data-close
        >
          Cancel
        </button>

        <button
          class="primary"
          type="submit"
          id="saveBtn"
        >
          Save application
        </button>
      </div>

    </form>

  </section>

</div>

<!-- RESTORE CONFIRMATION -->
<div class="overlay hidden" id="confirmOverlay">

  <section
    class="modal confirm-modal"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirmTitle"
  >

    <div class="modal-heading">
      <h2 id="confirmTitle">Restore backup?</h2>
    </div>

    <p class="confirm-message" id="confirmText"></p>

    <div class="actions">
      <button
        class="secondary"
        id="cancelConfirm"
        type="button"
      >
        Cancel
      </button>

      <button
        class="primary"
        id="confirmAction"
        type="button"
      >
        Restore
      </button>
    </div>

  </section>

</div>

<!-- JAVASCRIPT -->
<script src="js/storage.js" defer></script>
<script src="js/app.js" defer></script>

</body>
</html>
